services:
  api:
    build: .
    container_name: is_fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/mydb
      UPLOAD_DIR: /app/uploads
    volumes:
      - .:/app
      - ./uploads:/app/uploads

  db:
    image: postgres:15
    container_name: is_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: